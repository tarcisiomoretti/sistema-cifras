<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cifras</title>
  <meta name="description" content="Biblioteca de cifras offline para igreja: PDFs, DOCX, repertórios e modo palco.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cifras">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./styles.css">
  <script src="./theme-init.js"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Cifras <span class="count" id="count"></span></h1>
      <button id="installBtn" class="primary" hidden>Instalar</button>
      <button id="folderBtn" class="icon-btn" title="Pasta das cifras" aria-label="Pasta das cifras">📁</button>
      <button id="themeBtn" class="icon-btn" title="Alternar tema" aria-label="Alternar tema claro/escuro">◐</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Seções">
      <button id="tabLibrary" class="tab on" role="tab" aria-selected="true">Biblioteca</button>
      <button id="tabLists" class="tab" role="tab" aria-selected="false">Repertórios</button>
    </div>
    <div id="searchWrap">
      <input type="search" id="search" placeholder="Buscar por nome, artista, tom, etiqueta ou letra…" autocomplete="off" aria-label="Buscar cifras">
    </div>
  </header>

  <main id="main"></main>

  <section class="viewer" id="viewer" aria-label="Visualizador de cifra" aria-hidden="true">
    <div class="viewer-bar">
      <button id="closeViewer" title="Fechar" aria-label="Fechar visualizador">✕</button>
      <span class="title" id="viewerTitle"></span>
      <button id="prevSong" title="Música anterior (seta esquerda)" aria-label="Música anterior">◀</button>
      <button id="nextSong" title="Próxima música (seta direita)" aria-label="Próxima música">▶</button>
      <button id="zoomOut" title="Diminuir zoom" aria-label="Diminuir zoom">−</button>
      <button id="zoomIn" title="Aumentar zoom" aria-label="Aumentar zoom">+</button>
      <button id="invertBtn" title="Inverter cores" aria-label="Inverter cores">◐</button>
      <button id="annotateBtn" title="Anotar no PDF com a caneta ou o dedo" aria-label="Anotar no PDF" hidden>✏<span class="label"> Anotar</span></button>
      <button id="restorePdfBtn" title="Restaurar o PDF original e remover anotações salvas" aria-label="Restaurar PDF original" hidden>↺<span class="label"> Remover anotações</span></button>
      <button id="locateBtn" title="Mostrar o caminho do arquivo na pasta" aria-label="Localizar arquivo">📂<span class="label"> Localizar</span></button>
      <button id="downloadBtn" title="Baixar uma cópia do arquivo"><span class="label">⤓ Baixar</span></button>
      <button id="shareBtn" title="Abrir no Samsung Notes ou em outro app"><span class="label">↗ Abrir em outro app</span></button>
    </div>
    <div class="annotation-bar" id="annotationBar" hidden>
      <div class="annot-colors" role="group" aria-label="Cor da caneta">
        <button class="annot-color on" data-annot-color="#111111" style="--swatch:#111111" title="Preto" aria-label="Caneta preta"></button>
        <button class="annot-color" data-annot-color="#d11a2a" style="--swatch:#d11a2a" title="Vermelho" aria-label="Caneta vermelha"></button>
        <button class="annot-color" data-annot-color="#1d4ed8" style="--swatch:#1d4ed8" title="Azul" aria-label="Caneta azul"></button>
        <button class="annot-color" data-annot-color="#15803d" style="--swatch:#15803d" title="Verde" aria-label="Caneta verde"></button>
      </div>
      <label class="annot-size">Espessura
        <input type="range" id="annotSize" min="1" max="10" step="1" value="3">
      </label>
      <button data-annot-act="undo" title="Desfazer último traço">↶ Desfazer</button>
      <button data-annot-act="eraser" id="annotEraserBtn" title="Borracha (também funciona com o botão do S Pen)">⌫ Borracha</button>
      <button data-annot-act="clear" title="Limpar todas as anotações desta sessão">Limpar</button>
      <button data-annot-act="pan" id="annotPanBtn" title="Rolar a cifra sem desenhar">✋ Rolar</button>
      <button data-annot-act="cancel" title="Sair sem salvar">Cancelar</button>
      <button class="primary" data-annot-act="save" title="Gravar as anotações no PDF original">Salvar no PDF</button>
    </div>
    <div id="viewerBody"></div>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-box" id="modalBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="progress" id="progress" hidden>
    <div class="progress-text" id="progressText" role="status" aria-live="polite"></div>
    <div class="progress-track"><div id="progressBar"></div></div>
  </div>

  <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp" hidden>
  <input type="file" id="folderInput" webkitdirectory directory multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp" hidden>

  <script src="./vendor/pdf.min.js"></script>
  <script src="./vendor/mammoth.browser.min.js"></script>
  <script src="./vendor/jszip.min.js"></script>
  <script src="./vendor/pdf-lib.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
